<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今天吃啥</title>
  <style>
/* ===== Reset & Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #FFC529;
  --primary-dark: #F5A623;
  --primary-light: #FFDD70;
  --primary-bg: #FFF8E7;
  --secondary: #333333;
  --secondary-light: #F7F7F5;
  --bg: #F5F5F3;
  --card-bg: #FFFFFF;
  --text: #1A1A1A;
  --text-light: #666666;
  --text-lighter: #AAAAAA;
  --border: #EEEEEE;
  --success: #34C759;
  --warning: #FF9500;
  --danger: #FF3B30;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow: 0 2px 16px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
}

html { font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Page Wrapper ===== */
.page {
  display: none;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 100px;
  animation: fadeIn 0.35s ease;
}
.page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 44px 0 28px;
}
.header .logo {
  font-size: 3.5rem;
  margin-bottom: 10px;
  display: block;
  animation: bounce 2.5s ease infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.header h1 {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}
.header h1 .accent {
  color: var(--primary-dark);
}
.header p {
  color: var(--text-light);
  font-size: 0.875rem;
  margin-top: 6px;
}

/* ===== Section ===== */
.section {
  margin-bottom: 24px;
}
.section-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .icon {
  font-size: 1.3rem;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-bg);
  border-radius: 10px;
}

/* ===== Tag Input Area ===== */
.tag-input-area {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.tags-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 32px;
  margin-bottom: 12px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 24px;
  font-size: 0.875rem;
  font-weight: 500;
  animation: slideUp 0.2s ease;
}
.tag-ingredient {
  background: var(--primary-bg);
  color: #8B6914;
  border: 1.5px solid rgba(255,197,41,0.3);
}
.tag-avoid {
  background: #FFF0F0;
  color: var(--danger);
  border: 1.5px solid rgba(255,59,48,0.15);
}
.tag-seasoning {
  background: #F0F7F0;
  color: #2D7A2D;
  border: 1.5px solid rgba(52,199,89,0.2);
}
.tag .remove {
  cursor: pointer;
  font-size: 1rem;
  opacity: 0.5;
  transition: opacity 0.2s;
  line-height: 1;
}
.tag .remove:hover { opacity: 1; }

.input-row {
  display: flex;
  gap: 8px;
}
.input-row input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
  background: var(--secondary-light);
}
.input-row input:focus {
  border-color: var(--primary);
  background: #fff;
}
.input-row input::placeholder {
  color: var(--text-lighter);
}
.btn-add {
  padding: 12px 18px;
  background: var(--primary);
  color: var(--text);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.btn-add:active { transform: scale(0.95); }
.btn-add:hover { background: var(--primary-dark); }

/* Quick add buttons */
.quick-adds {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.quick-add-btn {
  padding: 5px 12px;
  border: 1.5px dashed #DDD;
  border-radius: 20px;
  background: none;
  font-size: 0.8rem;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
}
.quick-add-btn:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
  background: var(--primary-bg);
}

/* ===== Saved Preferences ===== */
.saved-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--secondary-light);
  border-radius: var(--radius-xs);
  font-size: 0.8rem;
  color: var(--text-light);
}
.saved-row .action-btns {
  display: flex;
  gap: 10px;
}
.saved-row button {
  background: none;
  border: none;
  color: var(--primary-dark);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}

/* ===== Main CTA Button ===== */
.btn-primary {
  display: block;
  width: 100%;
  padding: 16px;
  background: var(--primary);
  color: var(--text);
  border: none;
  border-radius: var(--radius);
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,197,41,0.35);
  transition: all 0.3s;
  margin-top: 24px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(255,197,41,0.45);
  background: var(--primary-dark);
}
.btn-primary:active {
  transform: translateY(0);
}
.btn-primary:disabled {
  background: #DDD;
  color: #999;
  box-shadow: none;
  cursor: not-allowed;
}

/* ===== Results Page ===== */
.results-header {
  display: flex;
  align-items: center;
  padding: 16px 0;
  gap: 14px;
}
.btn-back {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary);
  color: var(--text);
  border: none;
  border-radius: 14px;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-back:active { transform: scale(0.9); }
.results-title {
  font-size: 1.25rem;
  font-weight: 700;
}
.results-count {
  font-size: 0.85rem;
  color: var(--text-light);
}

/* ===== Filter Bar ===== */
.filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0 16px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-chip {
  padding: 8px 16px;
  border: 1.5px solid var(--border);
  border-radius: 24px;
  background: var(--card-bg);
  font-size: 0.82rem;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
  font-weight: 500;
}
.filter-chip.active {
  border-color: var(--primary);
  color: var(--text);
  background: var(--primary-bg);
  font-weight: 600;
}
.filter-chip:active { transform: scale(0.95); }

.filter-group {
  padding: 10px 0;
}
.filter-group-title {
  font-size: 0.82rem;
  color: var(--text-lighter);
  font-weight: 600;
  margin-bottom: 8px;
}
.filter-group .filter-bar {
  padding: 0;
}

/* ===== Recipe Card ===== */
.recipe-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.recipe-card {
  display: flex;
  gap: 14px;
  padding: 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.25s;
  animation: slideUp 0.3s ease;
  animation-fill-mode: both;
}
.recipe-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.recipe-card:active {
  transform: translateY(0);
}
.recipe-card .emoji-img {
  width: 68px;
  height: 68px;
  background: var(--secondary-light);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  flex-shrink: 0;
}
.recipe-card .info {
  flex: 1;
  min-width: 0;
}
.recipe-card .name {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 2px;
}
.recipe-card .desc {
  font-size: 0.8rem;
  color: var(--text-light);
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.recipe-card .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.meta-tag {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 600;
}
.meta-tag.perfect {
  background: #E8F9E8;
  color: #2D8A2D;
}
.meta-tag.missing-seasoning {
  background: #FFF3E0;
  color: var(--warning);
}
.meta-tag.missing-ingredient {
  background: #FFEBE8;
  color: var(--danger);
}
.meta-tag.method {
  background: var(--primary-bg);
  color: var(--primary-dark);
}
.meta-tag.time {
  background: #EEF6FF;
  color: #2E7DD1;
}

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.9rem; }

/* ===== Detail Page ===== */
.detail-hero {
  text-align: center;
  padding: 36px 0 24px;
}
.detail-hero .emoji-big {
  font-size: 5rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 120px;
  height: 120px;
  background: var(--secondary-light);
  border-radius: 32px;
  margin-bottom: 16px;
}
.detail-hero h2 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.detail-hero .desc {
  color: var(--text-light);
  font-size: 0.9rem;
  margin-top: 4px;
}
.detail-meta {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}
.detail-meta-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 12px 10px;
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  min-width: 72px;
  border: 2px solid var(--primary-bg);
}
.detail-meta-item .value {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  background: var(--primary);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 0.75rem;
  margin-bottom: 6px;
}
.detail-meta-item .label {
  font-size: 0.7rem;
  color: var(--text-lighter);
  font-weight: 500;
}

/* Detail sections */
.detail-section {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.detail-section h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Ingredient list in detail */
.ingredient-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.ingredient-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--secondary-light);
  border-radius: var(--radius-xs);
  font-size: 0.85rem;
}
.ingredient-item .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.ingredient-item .dot.have { background: var(--success); }
.ingredient-item .dot.need { background: var(--danger); }
.ingredient-item .amount {
  color: var(--text-lighter);
  font-size: 0.75rem;
  margin-left: auto;
}

/* Steps */
.step-list {
  counter-reset: step;
}
.step-item {
  display: flex;
  gap: 14px;
  margin-bottom: 18px;
  position: relative;
}
.step-item:last-child { margin-bottom: 0; }
.step-item::before {
  counter-increment: step;
  content: counter(step);
  width: 30px;
  height: 30px;
  background: var(--primary);
  color: var(--text);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 700;
  flex-shrink: 0;
}
.step-item:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 14px;
  top: 34px;
  bottom: -14px;
  width: 2px;
  background: var(--primary-bg);
}
.step-item .step-text {
  font-size: 0.9rem;
  line-height: 1.7;
  padding-top: 4px;
}

/* Tips */
.tip-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tip-item {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  background: var(--primary-bg);
  border-radius: var(--radius-xs);
  font-size: 0.85rem;
  color: #8B6914;
}
.tip-item::before {
  content: '\1F4A1';
  flex-shrink: 0;
}

/* Seasoning list in detail */
.seasoning-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.seasoning-item {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 500;
}
.seasoning-item.have {
  background: #F0F7F0;
  color: #2D7A2D;
}
.seasoning-item.essential-missing {
  background: #FFF3E0;
  color: var(--warning);
}
.seasoning-item.optional-missing {
  background: #F5F5F5;
  color: var(--text-lighter);
}

/* ===== Tutorial Links ===== */
.tutorial-links-section {
  background: linear-gradient(135deg, var(--primary-bg), #FFFDF5);
}
.tutorial-desc {
  font-size: 0.82rem;
  color: var(--text-lighter);
  margin-bottom: 14px;
}
.tutorial-links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tutorial-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
}
.tutorial-btn:active {
  transform: scale(0.98);
}
.tutorial-btn .tutorial-icon {
  font-size: 1.6rem;
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
}
.tutorial-btn .tutorial-text {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.tutorial-btn .tutorial-platform {
  font-size: 0.95rem;
  font-weight: 700;
}
.tutorial-btn .tutorial-sub {
  font-size: 0.75rem;
  color: var(--text-lighter);
  margin-top: 2px;
}
.tutorial-btn .tutorial-arrow {
  font-size: 1.1rem;
  color: var(--text-lighter);
  flex-shrink: 0;
}
/* Platform colors */
.tutorial-btn.xiaohongshu {
  background: #FFF0F0;
}
.tutorial-btn.xiaohongshu .tutorial-icon {
  background: #FFE4E4;
}
.tutorial-btn.xiaohongshu .tutorial-platform {
  color: #FF2442;
}
.tutorial-btn.bilibili {
  background: #F0F6FF;
}
.tutorial-btn.bilibili .tutorial-icon {
  background: #E4EFFF;
}
.tutorial-btn.bilibili .tutorial-platform {
  color: #00A1D6;
}

/* ===== Footer Note ===== */
.footer-note {
  text-align: center;
  margin-top: 24px;
  padding: 16px;
}
.footer-note p {
  font-size: 0.75rem;
  color: var(--text-lighter);
}

/* ===== Utilities ===== */
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.text-center { text-align: center; }

/* ===== Responsive ===== */
@media (max-width: 360px) {
  .ingredient-list { grid-template-columns: 1fr; }
  .detail-meta { gap: 8px; }
  .detail-meta-item { min-width: 65px; padding: 10px 8px; }
}

  </style>
</head>
<body>


  <!-- ==================== Page 1: 输入食材 ==================== -->
  <div id="page-input" class="page active">
    
    <div class="header">
      <span class="logo">🍳</span>
      <h1>今天<span class="accent">吃啥</span></h1>
      <p>告诉我冰箱里有啥，帮你想好做什么</p>
    </div>

    <!-- 食材输入 -->
    <div class="section">
      <div class="section-title"><span class="icon">🥬</span> 冰箱里有什么食材？</div>
      <div class="tag-input-area">
        <div class="tags-container" id="ingredients-tags"></div>
        <div class="input-row">
          <input type="text" id="input-ingredient" placeholder="输入食材，如：西红柿、鸡蛋">
          <button class="btn-add" onclick="App.addTag('ingredients', 'input-ingredient')">添加</button>
        </div>
        <div class="quick-adds" id="quick-ingredients"></div>
      </div>
    </div>

    <!-- 忌口 -->
    <div class="section">
      <div class="section-title"><span class="icon">🚫</span> 不要什么 / 忌口 / 过敏</div>
      <div class="tag-input-area">
        <div class="tags-container" id="avoid-tags"></div>
        <div class="input-row">
          <input type="text" id="input-avoid" placeholder="如：辣椒、花生（不填也行）">
          <button class="btn-add" onclick="App.addTag('avoidList', 'input-avoid')">添加</button>
        </div>
        <div class="quick-adds" id="quick-avoid"></div>
        <div class="saved-row" id="avoid-save-row"></div>
      </div>
    </div>

    <!-- 调料 -->
    <div class="section">
      <div class="section-title"><span class="icon">🧂</span> 家里有什么调料？</div>
      <div class="tag-input-area">
        <div class="tags-container" id="seasonings-tags"></div>
        <div class="input-row">
          <input type="text" id="input-seasoning" placeholder="如：盐、酱油、醋（不填=不检查调料）">
          <button class="btn-add" onclick="App.addTag('seasonings', 'input-seasoning')">添加</button>
        </div>
        <div class="quick-adds" id="quick-seasonings"></div>
        <div class="saved-row" id="seasoning-save-row"></div>
      </div>
    </div>

    <!-- 搜索按钮 -->
    <button class="btn-primary" id="btn-search" onclick="App.doSearch()" disabled>
      请先添加食材
    </button>

    <div class="footer-note">
      <p>内置 100 道真实家常菜谱 · 打开就能用 · 不需要联网</p>
    </div>
  </div>

  <!-- ==================== Page 2: 搜索结果 ==================== -->
  <div id="page-results" class="page">
    
    <div class="results-header">
      <button class="btn-back" onclick="App.goBack()">←</button>
      <div>
        <div class="results-title">可以做的菜</div>
        <div class="results-count" id="results-count"></div>
      </div>
    </div>

    <!-- 快捷筛选 -->
    <div class="filter-group">
      <div class="filter-group-title">🔥 快捷筛选</div>
      <div class="filter-bar">
        <button class="filter-chip" data-filter-type="noBuy" data-filter-value="true" onclick="App.applyFilter('noBuy')">不用出门买</button>
        <button class="filter-chip" data-filter-type="allowBuyOne" data-filter-value="true" onclick="App.applyFilter('allowBuyOne')">最多再买1样</button>
        <button class="filter-chip" data-filter-type="noFire" data-filter-value="true" onclick="App.applyFilter('noFire')">不用开火</button>
        <button class="filter-chip" data-filter-type="onePot" data-filter-value="true" onclick="App.applyFilter('onePot')">一锅出</button>
      </div>
    </div>
    
    <div class="filter-group">

/**
 * 今天吃啥 - 本地匹配引擎
 * 根据用户输入的食材、调料、忌口，从菜谱库中智能推荐
 */

const Engine = {
  /**
   * 调料等价表：某些调料可以互相替代
   */
  seasoningAliases: {
    '生抽': ['酱油', '味极鲜'],
    '酱油': ['生抽', '味极鲜'],
    '老抽': ['酱油', '生抽'],
    '醋': ['陈醋', '香醋', '米醋', '白醋'],
    '陈醋': ['醋', '香醋'],
    '香醋': ['醋', '陈醋'],
    '糖': ['白糖', '冰糖', '红糖'],
    '白糖': ['糖', '冰糖'],
    '冰糖': ['糖', '白糖'],
    '干辣椒': ['辣椒', '辣椒粉', '辣椒油'],
    '辣椒': ['干辣椒', '辣椒粉'],
    '辣椒油': ['辣椒', '干辣椒'],
    '蚝油': [],
    '番茄酱': [],
    '豆瓣酱': [],
    '甜面酱': ['黄豆酱'],
  },

  /**
   * 可省略的调料：缺了不算缺（除非标记为essential）
   */
  optionalSeasonings: ['鸡精', '味精', '白胡椒粉', '十三香', '五香粉', '芝麻', '香菜', '葱', '姜'],

  /**
   * 食材别名/归类
   */
  ingredientAliases: {
    '青菜': ['小白菜', '油麦菜', '菠菜', '生菜', '空心菜', '小油菜', '上海青', '青菜'],
    '白菜': ['大白菜', '白菜', '娃娃菜', '小白菜'],
    '辣椒': ['青椒', '辣椒', '尖椒', '线椒'],
    '鸡肉': ['鸡腿', '鸡胸肉', '鸡翅', '鸡肉', '鸡腿肉'],
    '猪肉': ['五花肉', '猪肉', '里脊肉', '排骨', '猪排', '肉末', '肉丝'],
    '面条': ['面条', '挂面', '意面', '拉面', '手擀面', '宽面'],
    '粉丝': ['粉丝', '粉条', '红薯粉'],
    '包菜': ['包菜', '卷心菜', '圆白菜', '甘蓝'],
    '蒜苗': ['蒜苗', '蒜苔'],
    '蒜苔': ['蒜苗', '蒜苔'],
  },

  /**
   * 主推荐方法
   * @param {string[]} userIngredients - 用户有的食材
   * @param {string[]} userSeasonings - 用户有的调料
   * @param {string[]} avoidList - 忌口
   * @returns {Array} 排序后的推荐菜品列表
   */
  recommend(userIngredients, userSeasonings, avoidList) {
    if (!userIngredients || userIngredients.length === 0) return [];

    const results = [];

    for (const recipe of RECIPES) {
      // 检查忌口
      if (this.hasAvoidItem(recipe, avoidList)) continue;

      // 计算食材匹配
      const ingredientMatch = this.matchIngredients(recipe, userIngredients);
      
      // 至少要匹配到一种必需食材才推荐
      if (ingredientMatch.matchedRequired === 0) continue;

      // 计算调料匹配
      const seasoningMatch = this.matchSeasonings(recipe, userSeasonings);

      // 计算综合状态
      const status = this.calcStatus(ingredientMatch, seasoningMatch);

      results.push({
        ...recipe,
        matchScore: ingredientMatch.score,
        ...ingredientMatch,
        ...seasoningMatch,
        ...status,
      });
    }

    // 排序：完全可做 > 缺调料 > 缺食材，同级别按匹配度排序
    results.sort((a, b) => {
      const statusOrder = { 'perfect': 0, 'missing_seasoning': 1, 'missing_ingredient': 2 };
      const sa = statusOrder[a.status] || 9;
      const sb = statusOrder[b.status] || 9;
      if (sa !== sb) return sa - sb;
      return b.matchScore - a.matchScore;
    });

    return results;
  },

  /**
   * 检查菜品是否包含忌口食材
   */
  hasAvoidItem(recipe, avoidList) {
    if (!avoidList || avoidList.length === 0) return false;
    
    const avoidLower = avoidList.map(a => a.toLowerCase());
    
    // 检查食材
    for (const ing of recipe.ingredients) {
      if (avoidLower.some(a => ing.name.toLowerCase().includes(a) || a.includes(ing.name.toLowerCase()))) {
        return true;
      }
    }
    
    // 检查调料
    for (const s of recipe.seasonings) {
      if (avoidLower.some(a => s.name.toLowerCase().includes(a) || a.includes(s.name.toLowerCase()))) {
        return true;
      }
    }

    return false;
  },

  /**
   * 匹配食材
   */
  matchIngredients(recipe, userIngredients) {
    let matchedRequired = 0;
    let totalRequired = 0;
    let matchedOptional = 0;
    let missingIngredients = [];
    const ingredientsWithStatus = [];

    for (const ing of recipe.ingredients) {
      const isRequired = ing.required !== false;
      if (isRequired) totalRequired++;
      
      const hasIt = this.userHasIngredient(ing.name, userIngredients);

      ingredientsWithStatus.push({
        ...ing,
        have: hasIt,
      });

      if (hasIt) {
        if (isRequired) matchedRequired++;
        else matchedOptional++;
      } else if (isRequired) {
        missingIngredients.push(ing.name);
      }
    }

    // 匹配分数：必需食材匹配比例 * 100 + 可选食材奖励
    const score = totalRequired > 0
      ? (matchedRequired / totalRequired) * 100 + matchedOptional * 5
      : matchedOptional * 10;

    return {
      matchedRequired,
      totalRequired,
      matchedOptional,
      missingIngredients,
      ingredientsWithStatus,
      score,
    };
  },

  /**
   * 检查用户是否有某种食材（支持别名）
   */
  userHasIngredient(needed, userIngredients) {
    const neededLower = needed.toLowerCase();
    
    for (const userIng of userIngredients) {
      const userLower = userIng.toLowerCase();
      
      // 直接匹配
      if (neededLower.includes(userLower) || userLower.includes(neededLower)) {
        return true;
      }
      
      // 别名匹配
      for (const [key, aliases] of Object.entries(this.ingredientAliases)) {
        const allNames = [key, ...aliases].map(n => n.toLowerCase());
        if (allNames.includes(neededLower) && allNames.includes(userLower)) {
          return true;
        }
        // 模糊匹配：用户输入的食材包含别名组中的某个
        if (allNames.some(n => n.includes(neededLower) || neededLower.includes(n))) {
          if (allNames.some(n => n.includes(userLower) || userLower.includes(n))) {
            return true;
          }
        }
      }
    }

    return false;
  },

  /**
   * 匹配调料
   */
  matchSeasonings(recipe, userSeasonings) {
    // 如果用户没有填调料，默认认为基本调料都有
    if (!userSeasonings || userSeasonings.length === 0) {
      return {
        seasoningStatus: { missingEssential: [], missingOptional: [] },
        seasoningsWithStatus: recipe.seasonings.map(s => ({ ...s, have: true })),
      };
    }

    const missingEssential = [];
    const missingOptional = [];
    const seasoningsWithStatus = [];

    for (const s of recipe.seasonings) {
      const hasIt = this.userHasSeasoning(s.name, userSeasonings);
      const isEssential = s.essential !== false;
      const isAlwaysOptional = this.optionalSeasonings.some(
        opt => s.name.includes(opt) || opt.includes(s.name)
      );

      seasoningsWithStatus.push({ ...s, have: hasIt });

      if (!hasIt) {
        if (isEssential && !isAlwaysOptional) {
          missingEssential.push(s.name);
        } else {
          missingOptional.push(s.name);
        }
      }
    }

    return {
      seasoningStatus: { missingEssential, missingOptional },
      seasoningsWithStatus,
    };
  },

  /**
   * 检查用户是否有某种调料（支持等价替代）
   */
  userHasSeasoning(needed, userSeasonings) {
    const neededLower = needed.toLowerCase();
    
    for (const userS of userSeasonings) {
      const userLower = userS.toLowerCase();
      
      // 直接匹配
      if (neededLower.includes(userLower) || userLower.includes(neededLower)) {
        return true;
      }
    }

    // 等价替代检查
    const aliases = this.seasoningAliases[needed] || [];
    for (const alias of aliases) {
      for (const userS of userSeasonings) {
        if (alias.toLowerCase().includes(userS.toLowerCase()) || userS.toLowerCase().includes(alias.toLowerCase())) {
          return true;
        }
      }
    }

    return false;
  },

  /**
   * 计算最终状态
   */
  calcStatus(ingredientMatch, seasoningMatch) {
    const missingIng = ingredientMatch.missingIngredients;
    const missingEssentialSeasoning = seasoningMatch.seasoningStatus.missingEssential;

    if (missingIng.length === 0 && missingEssentialSeasoning.length === 0) {
      return {
        status: 'perfect',
        statusText: '完全可做 ✅',
      };
    }

    if (missingIng.length === 0 && missingEssentialSeasoning.length > 0) {
      return {
        status: 'missing_seasoning',
        statusText: `缺调料：${missingEssentialSeasoning.join('、')}`,
      };
    }

    return {
      status: 'missing_ingredient',
      statusText: `缺食材：${missingIng.join('、')}`,
    };
  },
};

  // ===== Default Quick-Add Items =====
  quickIngredients: ['西红柿', '鸡蛋', '黄瓜', '土豆', '青椒', '白菜', '豆腐', '面条', '米饭', '猪肉', '鸡肉', '茄子', '红薯', '包菜', '蒜苔', '胡萝卜', '粉丝', '虾', '排骨', '牛肉'],
  quickSeasonings: ['盐', '食用油', '生抽', '老抽', '醋', '糖', '蒜', '姜', '葱', '料酒', '辣椒油', '花椒', '豆瓣酱', '香油', '蚝油', '番茄酱', '干辣椒', '黑胡椒'],
  quickAvoid: ['辣椒', '葱', '姜', '蒜', '花椒', '香菜', '牛肉', '猪肉', '羊肉', '海鲜'],

  // ===== Init =====
  init() {
    this.loadSaved();
    this.renderPage('input');
    this.setupEventListeners();
    this.renderQuickAdds();
  },

  // ===== LocalStorage =====
  loadSaved() {
    const savedAvoid = localStorage.getItem('eat_avoid');
    const savedSeasonings = localStorage.getItem('eat_seasonings');
    if (savedAvoid) this.avoidList = JSON.parse(savedAvoid);
    if (savedSeasonings) this.seasonings = JSON.parse(savedSeasonings);
  },

  saveAvoid() {
    localStorage.setItem('eat_avoid', JSON.stringify(this.avoidList));
    this.showToast('忌口已保存');
  },

  saveSeasonings() {
    localStorage.setItem('eat_seasonings', JSON.stringify(this.seasonings));
    this.showToast('调料已保存');
  },

  // ===== Navigation =====
  renderPage(page, data) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(`page-${page}`);
    if (target) {
      target.classList.add('active');
      window.scrollTo(0, 0);
    }

    if (page === 'input') {
      this.renderInputPage();
    } else if (page === 'results') {
      this.renderResultsPage();
    } else if (page === 'detail') {
      this.renderDetailPage(data);
    }
  },

  // ===== Input Page =====
  renderInputPage() {
    this.renderTags('ingredients-tags', this.ingredients, 'tag-ingredient', 'ingredients');
    this.renderTags('avoid-tags', this.avoidList, 'tag-avoid', 'avoidList');
    this.renderTags('seasonings-tags', this.seasonings, 'tag-seasoning', 'seasonings');
    this.updateSearchButton();
    this.updateSavedStatus();
  },

  renderTags(containerId, items, className, listName) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (items.length === 0) {
      container.innerHTML = '<span style="color:var(--text-lighter);font-size:0.85rem;">还没有添加...</span>';
      return;
    }

    const existingTags = container.querySelectorAll('.tag');
    const oldCount = existingTags.length;

    container.innerHTML = items.map((item, i) => `
      <span class="tag ${className}" style="${i < oldCount ? 'animation:none;' : ''}">
        ${item}
        <span class="remove" onclick="App.removeTag('${listName}', ${i})">×</span>
      </span>
    `).join('');
  },

  renderQuickAdds() {
    this.renderQuickAddBtns('quick-ingredients', this.quickIngredients, 'ingredients');
    this.renderQuickAddBtns('quick-avoid', this.quickAvoid, 'avoidList');
    this.renderQuickAddBtns('quick-seasonings', this.quickSeasonings, 'seasonings');
  },

  renderQuickAddBtns(containerId, items, listName) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = items.map(item => `
      <button class="quick-add-btn" onclick="App.quickAdd('${listName}', '${item}')">+ ${item}</button>
    `).join('');
  },

  quickAdd(listName, item) {
    if (!this[listName].includes(item)) {
      this[listName].push(item);
      this.renderInputPage();
    }
  },

  addTag(listName, inputId) {
    const input = document.getElementById(inputId);
    const value = input.value.trim();
    if (value && !this[listName].includes(value)) {
      const items = value.split(/[,，、\s]+/).filter(Boolean);
      items.forEach(item => {
        if (item && !this[listName].includes(item)) {
          this[listName].push(item);
        }
      });
      input.value = '';
      this.renderInputPage();
    }
  },

  removeTag(listName, index) {
    const containerMap = {
      'ingredients': 'ingredients-tags',
      'avoidList': 'avoid-tags',
      'seasonings': 'seasonings-tags'
    };
    const containerId = containerMap[listName];
    const container = document.getElementById(containerId);

    this[listName].splice(index, 1);

    if (container) {
      const tags = container.querySelectorAll('.tag');
      const targetTag = tags[index];
      if (targetTag) {
        targetTag.style.transition = 'opacity 0.2s, transform 0.2s';
        targetTag.style.opacity = '0';
        targetTag.style.transform = 'scale(0.8)';
        targetTag.addEventListener('transitionend', () => {
          this.renderTagsNoAnim(containerId, this[listName], this.getTagClass(listName), listName);
        }, { once: true });
      } else {
        this.renderTagsNoAnim(containerId, this[listName], this.getTagClass(listName), listName);
      }
    }

    this.updateSearchButton();
    this.updateSavedStatus();
  },

  getTagClass(listName) {
    const map = { 'ingredients': 'tag-ingredient', 'avoidList': 'tag-avoid', 'seasonings': 'tag-seasoning' };
    return map[listName];
  },

  renderTagsNoAnim(containerId, items, className, listName) {
    const container = document.getElementById(containerId);
    if (!container) return;

    if (items.length === 0) {
      container.innerHTML = '<span style="color:var(--text-lighter);font-size:0.85rem;">还没有添加...</span>';
      return;
    }

    container.innerHTML = items.map((item, i) => `
      <span class="tag ${className}" style="animation:none;">
        ${item}
        <span class="remove" onclick="App.removeTag('${listName}', ${i})">×</span>
      </span>
    `).join('');
  },

  updateSearchButton() {
    const btn = document.getElementById('btn-search');
    if (btn) {
      btn.disabled = this.ingredients.length === 0;
      btn.textContent = this.ingredients.length === 0
        ? '请先添加食材'
        : `开始找菜 🍳 (${this.ingredients.length}种食材)`;
    }
  },

  updateSavedStatus() {
    const savedAvoid = localStorage.getItem('eat_avoid');
    const savedSeasonings = localStorage.getItem('eat_seasonings');

    const avoidSaveRow = document.getElementById('avoid-save-row');
    const seasoningSaveRow = document.getElementById('seasoning-save-row');

    if (avoidSaveRow) {
      if (savedAvoid && this.avoidList.length > 0) {
        avoidSaveRow.innerHTML = '<span>\u2705 已保存</span><div class="action-btns"><button onclick="App.saveAvoid()">更新</button><button onclick="App.clearSaved(\'avoid\')">清除</button></div>';
      } else if (this.avoidList.length > 0) {
        avoidSaveRow.innerHTML = '<span>未保存</span><button onclick="App.saveAvoid()">保存到下次</button>';
      } else {
        avoidSaveRow.innerHTML = '';
      }
    }

    if (seasoningSaveRow) {
      if (savedSeasonings && this.seasonings.length > 0) {
        seasoningSaveRow.innerHTML = '<span>\u2705 已保存</span><div class="action-btns"><button onclick="App.saveSeasonings()">更新</button><button onclick="App.clearSaved(\'seasonings\')">清除</button></div>';
      } else if (this.seasonings.length > 0) {
        seasoningSaveRow.innerHTML = '<span>未保存</span><button onclick="App.saveSeasonings()">保存到下次</button>';
      } else {
        seasoningSaveRow.innerHTML = '';
      }
    }
  },

  clearSaved(type) {
    if (type === 'avoid') {
      localStorage.removeItem('eat_avoid');
    } else {
      localStorage.removeItem('eat_seasonings');
    }
    this.showToast('已清除保存');
    this.updateSavedStatus();
  },

  // ===== Search (Local Engine) =====
  doSearch() {
    if (this.ingredients.length === 0) return;

    this.currentFilters = {};
    this.allResults = Engine.recommend(this.ingredients, this.seasonings, this.avoidList);
    this.results = [...this.allResults];

    this.renderPage('results');
  },

  // ===== Results Page =====
  renderResultsPage() {
    const container = document.getElementById('results-list');
    const countEl = document.getElementById('results-count');

    if (countEl) {
      countEl.textContent = `找到 ${this.results.length} 道菜`;
    }

    if (!container) return;

    if (this.results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="emoji">😅</div>
          <p>没有找到匹配的菜品</p>
          <p style="margin-top:8px;font-size:0.8rem;">试试减少筛选条件，或者添加更多食材</p>
        </div>
      `;
      return;
    }

    container.innerHTML = this.results.map((r, i) => `
      <div class="recipe-card" style="animation-delay:${i * 0.04}s" onclick="App.showDetail(${r.id})">
        <div class="emoji-img">${r.img}</div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="desc">${r.desc || ''}</div>
          <div class="meta">
            <span class="meta-tag ${r.status === 'perfect' ? 'perfect' : r.status === 'missing_seasoning' ? 'missing-seasoning' : 'missing-ingredient'}">${r.statusText}</span>
            <span class="meta-tag method">${r.method}</span>
            <span class="meta-tag time">${r.time}分钟</span>
          </div>
        </div>
      </div>
    `).join('');
  },

  applyFilter(type, value) {
    const booleanFilters = ['noFire', 'onePot', 'noBuy', 'allowBuyOne'];

    if (booleanFilters.includes(type)) {
      if (this.currentFilters[type]) {
        delete this.currentFilters[type];
      } else {
        this.currentFilters[type] = true;
      }
    } else {
      if (this.currentFilters[type] === value) {
        delete this.currentFilters[type];
      } else {
        this.currentFilters[type] = value;
      }
    }

    this.results = this.filterResults(this.allResults, this.currentFilters);
    this.renderResultsPage();
    this.updateFilterChips();
  },

  filterResults(all, filters) {
    let results = [...all];

    if (filters.servings) {
      if (filters.servings === '一人食') {
        results = results.filter(r => r.servings <= 1);
      } else if (filters.servings === '多人食') {
        results = results.filter(r => r.servings >= 2);
      }
    }

    if (filters.method) {
      results = results.filter(r => {
        if (filters.method === '焖') return r.method === '焖' || r.method === '炖';
        return r.method === filters.method;
      });
    }

    if (filters.cuisine) {
      results = results.filter(r => r.cuisine === filters.cuisine);
    }

    if (filters.noFire) {
      results = results.filter(r =>
        r.method === '拌' || r.method === '无火' ||
        (r.tags && r.tags.includes('无火'))
      );
    }

    if (filters.onePot) {
      results = results.filter(r => r.tags && r.tags.includes('一锅出'));
    }

    if (filters.noBuy) {
      results = results.filter(r =>
        r.status === 'perfect' || r.status === 'missing_seasoning'
      );
    }

    if (filters.allowBuyOne) {
      results = results.filter(r =>
        !r.missingIngredients || r.missingIngredients.length <= 1
      );
    }

    return results;
  },

  updateFilterChips() {
    document.querySelectorAll('.filter-chip').forEach(chip => {
      const type = chip.dataset.filterType;
      const value = chip.dataset.filterValue;

      if (type === 'noFire' || type === 'onePot' || type === 'noBuy' || type === 'allowBuyOne') {
        chip.classList.toggle('active', !!this.currentFilters[type]);
      } else {
        chip.classList.toggle('active', this.currentFilters[type] === value);
      }
    });
  },

  // ===== Detail Page =====
  showDetail(recipeId) {
    const recipe = this.results.find(r => r.id === recipeId) ||
                   this.allResults.find(r => r.id === recipeId);
    if (!recipe) return;
    this.renderPage('detail', recipe);
  },

  renderDetailPage(recipe) {
    const container = document.getElementById('detail-content');
    if (!container) return;

    // 使用匹配引擎的结果，或者直接用原始数据
    const ingredients = recipe.ingredientsWithStatus || recipe.ingredients.map(i => ({ ...i, have: true }));
    const seasonings = recipe.seasoningsWithStatus || recipe.seasonings;
    const seasoningStatus = recipe.seasoningStatus || { missingEssential: [], missingOptional: [] };

    // 优先使用具体视频链接，否则回退到搜索页
    const biliUrl = recipe.bv
      ? `https://www.bilibili.com/video/${recipe.bv}`
      : `https://search.bilibili.com/all?keyword=${encodeURIComponent(recipe.name + ' 做法 教程')}&order=click`;
    const xhsSearchUrl = `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(recipe.name + ' 做法 教程')}&type=51`;

    container.innerHTML = `
      <!-- Hero -->
      <div class="detail-hero">
        <span class="emoji-big">${recipe.img}</span>
        <h2>${recipe.name}</h2>
        <p class="desc">${recipe.desc || ''}</p>
        <div class="detail-meta">
          <div class="detail-meta-item">
            <span class="value">${recipe.time}min</span>
            <span class="label">烹饪时间</span>
          </div>
          <div class="detail-meta-item">
            <span class="value">${recipe.method}</span>
            <span class="label">烹饪方式</span>
          </div>
          <div class="detail-meta-item">
            <span class="value">${recipe.servings <= 1 ? '1人' : recipe.servings + '人'}</span>
            <span class="label">份量</span>
          </div>
          <div class="detail-meta-item">
            <span class="value">${recipe.cuisine}</span>
            <span class="label">菜系</span>
          </div>
        </div>
      </div>

      <!-- Ingredients -->
      <div class="detail-section">
        <h3>\uD83E\uDD6C 食材清单</h3>
        <div class="ingredient-list">
          ${ingredients.map(ing => {
            const have = ing.have !== false;
            return `<div class="ingredient-item">
              <span class="dot ${have ? 'have' : 'need'}"></span>
              <span>${ing.name}${ing.required === false ? '(可选)' : ''}</span>
              <span class="amount">${ing.amount || ''}</span>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Seasonings -->
      ${seasonings && seasonings.length > 0 ? `
      <div class="detail-section">
        <h3>\uD83E\uDDC2 调料</h3>
        <div class="seasoning-list">
          ${seasonings.map(s => {
            const isMissingEssential = (seasoningStatus.missingEssential || []).includes(s.name);
            const isMissingOptional = (seasoningStatus.missingOptional || []).includes(s.name);
            let cls = 'have';
            let suffix = '';
            if (isMissingEssential) {
              cls = 'essential-missing';
              suffix = ' \u26a0\ufe0f\u7f3a';
            } else if (isMissingOptional) {
              cls = 'optional-missing';
              suffix = ' (\u53ef\u7701)';
            }
            return `<span class="seasoning-item ${cls}">${s.name} ${s.amount || ''}${suffix}</span>`;
          }).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Steps -->
      <div class="detail-section">
        <h3>\uD83D\uDC68\u200D\uD83C\uDF73 做法步骤</h3>
        <div class="step-list">
          ${(recipe.steps || []).map(step => `
            <div class="step-item">
              <div class="step-text">${step}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Tips -->
      ${recipe.tips && recipe.tips.length > 0 ? `
      <div class="detail-section">
        <h3>小贴士</h3>
        <div class="tip-list">
          ${recipe.tips.map(tip => `<div class="tip-item">${tip}</div>`).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Video Tutorial Links -->
      <div class="detail-section tutorial-links-section">
        <h3>\uD83D\uDCFA 去看视频教程</h3>
        <p class="tutorial-desc">点击跳转到最相关的视频教程，跟着做更简单</p>
        <div class="tutorial-links">
          <a class="tutorial-btn bilibili" href="${biliUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <span class="tutorial-icon">\uD83D\uDCFA</span>
            <span class="tutorial-text">
              <span class="tutorial-platform">B站视频教程</span>
              <span class="tutorial-sub">${recipe.bv ? '精选热门教程，点击直达' : '按播放量排序，最热门的排最前面'}</span>
            </span>
            <span class="tutorial-arrow">\u2192</span>
          </a>
          <a class="tutorial-btn xiaohongshu" href="${xhsSearchUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <span class="tutorial-icon">\uD83D\uDCD5</span>
            <span class="tutorial-text">
              <span class="tutorial-platform">小红书图文教程</span>
              <span class="tutorial-sub">图文 + 短视频教程</span>
            </span>
            <span class="tutorial-arrow">\u2192</span>
          </a>
        </div>
      </div>
    `;
  },

  goBack() {
    const detailPage = document.getElementById('page-detail');
    if (detailPage && detailPage.classList.contains('active')) {
      this.renderPage('results');
    } else {
      this.renderPage('input');
    }
  },

  // ===== Toast =====
  showToast(msg) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;background:rgba(0,0,0,0.75);color:white;border-radius:20px;font-size:0.85rem;z-index:999;transition:opacity 0.3s;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 2000);
  },

  // ===== Event Listeners =====
  setupEventListeners() {
    ['input-ingredient', 'input-avoid', 'input-seasoning'].forEach(id => {
      const input = document.getElementById(id);
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const listMap = {
              'input-ingredient': 'ingredients',
              'input-avoid': 'avoidList',
              'input-seasoning': 'seasonings'
            };
            this.addTag(listMap[id], id);
          }
        });
      }
    });
  }
};

// Start
document.addEventListener('DOMContentLoaded', () => App.init());

  </script>
</body>
</html>
